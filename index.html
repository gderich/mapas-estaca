<style>
  :root {
    --fundo: #071936;
    --painel: #0C2042;
    --painel-2: #142A4D;
    --tinta: #FFF8F0;
    --tinta-2: #D7DCE5;
    --linha: rgba(255,255,255,.17);
    --acento: #E9BC91;
    --acento-escuro: #D6A477;
    --alerta: #FFE0C3;
    --alerta-fundo: rgba(233,188,145,.16);
    --neutro-fundo: #1A3154;
    --fonte-titulo: "Montserrat", "Lato", system-ui, sans-serif;
    --fonte: "Lato", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--fonte);
    font-size: 16px;
    line-height: 1.45;
    color: var(--tinta);
    background: var(--fundo);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  button, input { font: inherit; color: inherit; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 3px solid var(--acento); outline-offset: 3px; }

  /* ---------- Estrutura ---------- */
  #app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  .painel {
    flex: none;
    max-height: 54vh; max-height: 54dvh;
    overflow-y: auto;
    background:
      radial-gradient(circle at 0 0, rgba(233,188,145,.09), transparent 32%),
      var(--painel);
    border-bottom: 1px solid var(--linha);
    padding: 0 16px 14px;
    z-index: 2;
  }
  #mapa { flex: 1; min-height: 0; background: #DDE3E7; }

  @media (min-width: 900px) {
    #app { flex-direction: row; }
    .painel {
      width: 448px; max-height: none; height: 100%;
      border-bottom: 0; border-right: 1px solid var(--linha);
      padding: 0 28px 22px;
    }
  }

  /* ---------- Cabeçalho ---------- */
  .marca {
    display: flex; align-items: center; gap: 12px;
    margin: 0 -16px 22px; padding: 13px 16px;
    min-height: 78px; background: #061631; border-bottom: 1px solid var(--linha);
  }
  .marca img { width: 43px; height: 58px; object-fit: contain; flex: none; }
  .marca-texto { line-height: 1.05; }
  .marca-nome {
    display: block; font-family: var(--fonte-titulo); font-size: .96rem;
    font-weight: 700; letter-spacing: .035em; color: var(--tinta);
  }
  .marca-lema {
    display: block; margin-top: 6px; color: var(--acento); font-size: .72rem;
    font-weight: 700; letter-spacing: .19em; text-transform: uppercase;
  }
  .sobrelinha {
    display: block; margin-bottom: 7px; color: var(--acento); font-size: .72rem;
    font-weight: 900; letter-spacing: .23em; text-transform: uppercase;
  }
  h1 {
    font-family: var(--fonte-titulo);
    font-weight: 700;
    font-size: 1.7rem;
    line-height: 1.12;
    letter-spacing: -0.025em;
    margin: 0 0 8px;
  }
  .sub { margin: 0 0 18px; color: var(--tinta-2); }
  @media (min-width: 900px) {
    .marca { margin: 0 -28px 28px; padding: 13px 28px; }
    h1 { font-size: 2rem; }
    .sub { margin-bottom: 22px; }
  }

  .aviso {
    background: var(--alerta-fundo); color: var(--alerta);
    border: 1px solid rgba(233,188,145,.25);
    border-radius: 12px; padding: 10px 12px; margin: 0 0 14px;
    font-size: .92rem; font-weight: 500;
  }

  /* ---------- Busca ---------- */
  .campo { display: flex; gap: 9px; }
  .campo input {
    flex: 1; min-width: 0; height: 48px;
    border: 1px solid rgba(255,255,255,.24); border-radius: 10px;
    padding: 0 14px; background: #fff; color: #0A1A34;
  }
  .campo input::placeholder { color: #6B7483; }
  .campo input:focus { border-color: var(--acento); outline: none; box-shadow: 0 0 0 3px rgba(233,188,145,.22); }
  .btn {
    height: 48px; padding: 0 18px; border: 0; border-radius: 10px;
    background: var(--acento); color: #0B1C38; font-weight: 700; cursor: pointer;
  }
  .btn:hover { background: var(--acento-escuro); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn.sec {
    height: 44px; background: transparent; color: var(--tinta);
    border: 1px solid rgba(233,188,145,.65); font-weight: 700;
  }
  .btn.sec:hover { background: rgba(233,188,145,.11); }

  .apoio { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-top: 8px; font-size: .92rem; color: var(--tinta-2); }
  .link {
    background: none; border: 0; padding: 6px 0; cursor: pointer;
    color: var(--acento); font-weight: 600; text-decoration: underline; text-underline-offset: 3px;
  }

  #status { min-height: 0; margin-top: 8px; font-size: .95rem; color: var(--tinta-2); }
  #status:empty { display: none; }
  #status.erro { color: var(--alerta); font-weight: 500; }

  #outros { list-style: none; margin: 6px 0 0; padding: 0; font-size: .92rem; }
  #outros li + li { border-top: 1px solid var(--linha); }
  #outros button {
    width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
    padding: 9px 2px; color: var(--tinta-2);
  }
  #outros button:hover { color: var(--acento); text-decoration: underline; }
  #outros .titulo-outros { padding: 4px 2px; font-weight: 600; color: var(--tinta); }

  /* ---------- Resultado ---------- */
  #resultado { margin: 14px 0 4px; }
  .bloco { border: 1px solid rgba(255,255,255,.13); border-radius: 14px; padding: 16px 18px 18px; box-shadow: 0 12px 34px rgba(0,0,0,.12); }
  .bloco .pre { margin: 0; font-size: .95rem; }
  .bloco .nome {
    font-family: var(--fonte-titulo); font-weight: 700;
    font-size: clamp(2rem, 8vw, 2.7rem); line-height: 1.02; letter-spacing: -0.015em;
    margin: 2px 0 8px;
  }
  .bloco .end { margin: 0; font-size: .9rem; opacity: .88; overflow-wrap: anywhere; }
  .bloco.fora { background: var(--neutro-fundo); color: var(--tinta); }
  .bloco.fora .nome { font-size: 1.35rem; line-height: 1.15; }
  .nota {
    margin: 8px 0 0; padding: 9px 12px; border-radius: 10px;
    background: var(--alerta-fundo); color: var(--alerta); font-size: .92rem;
  }
  .nota.info { background: rgba(233,188,145,.13); color: var(--tinta); }

  /* ---------- Lista de alas ---------- */
  .alas { margin-top: 18px; }
  h2 { font-family: var(--fonte-titulo); font-size: 1.02rem; margin: 0 0 10px; }
  #listaAlas { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 44px; padding: 0 14px 0 10px;
    background: rgba(255,255,255,.045); border: 1px solid var(--linha); border-radius: 999px; cursor: pointer;
    color: var(--tinta); font-weight: 600;
  }
  .chip:hover { border-color: var(--acento); background: rgba(233,188,145,.08); }
  .chip[aria-pressed="true"] { border-color: var(--acento); background: var(--acento); color: #0B1C38; }
  .ponto { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(19,34,43,.55); flex: none; }
  .chip[aria-pressed="true"] .ponto { border-color: #0B1C38; }

  #detalhe { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--linha); }
  #detalhe h3 { font-family: var(--fonte-titulo); font-size: 1.05rem; margin: 0 0 4px; }
  #detalhe p { margin: 0 0 10px; color: var(--tinta-2); font-size: .92rem; }
  .botoes { display: flex; flex-wrap: wrap; gap: 8px; }

  .rodape { margin: 18px 0 0; font-size: .85rem; color: var(--tinta-2); }

  /* ---------- Mapa ---------- */
  .rotulo-ala {
    background: transparent; border: 0; box-shadow: none;
    font-family: var(--fonte-titulo); font-weight: 700; font-size: 14px; color: #13222B;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 5px #fff, 0 0 5px #fff;
    white-space: nowrap; padding: 0;
  }
  .rotulo-ala::before { display: none; }
  .pino span {
    display: block; width: 26px; height: 26px; background: var(--tinta);
    border: 3px solid #fff; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    box-shadow: 0 2px 7px rgba(0,0,0,.4); position: relative;
  }
  .pino span::after {
    content: ""; position: absolute; inset: 6px; background: #fff; border-radius: 50%;
  }

  /* ---------- Capelas no mapa ---------- */
  .capela span {
    display: block; width: 30px; height: 30px; border-radius: 50%; overflow: hidden;
    background: #2389AD; border: 2px solid #fff;
    box-shadow: 0 0 0 1.5px #071936, 0 2px 8px rgba(0,0,0,.48);
  }
  .capela img { display: block; width: 100%; height: 100%; object-fit: cover; }

  /* ---------- Janela do cartaz ---------- */
  dialog {
    border: 0; border-radius: 16px; padding: 22px 22px 18px;
    width: min(460px, calc(100vw - 24px)); color: #0B1C38; background: #FFF9F2;
    box-shadow: 0 18px 60px rgba(19,34,43,.35);
  }
  dialog::backdrop { background: rgba(19,34,43,.45); }
  dialog h2 { font-size: 1.35rem; margin: 0 0 4px; }
  dialog .btn { color: #0B1C38; }
  dialog .btn.sec { color: #0B1C38; background: #fff; border-color: #C99668; }
  dialog .btn.sec:hover { background: #F8E8D9; }
  dialog .link { color: #75502F; }
  .dlg-sub { margin: 0 0 14px; color: #566274; font-size: .95rem; }
  .linha { display: grid; gap: 4px; margin-bottom: 12px; }
  .linha label, .check { font-weight: 600; font-size: .95rem; }
  select {
    height: 44px; border: 2px solid var(--linha); border-radius: 10px; padding: 0 10px; background: #fff; width: 100%;
  }
  select:focus { border-color: var(--acento); outline: none; box-shadow: 0 0 0 3px rgba(11,85,102,.2); }
  .check { display: flex; align-items: center; gap: 10px; margin: 4px 0 14px; font-weight: 500; }
  .check input { width: 20px; height: 20px; }
  progress { width: 100%; height: 10px; margin: 2px 0 6px; accent-color: var(--acento); }
  #dlgMsg { min-height: 1.4em; margin: 0 0 12px; font-size: .92rem; color: #566274; }
  #dlgMsg.erro { color: var(--alerta); font-weight: 500; }
  .dica-cartaz { margin: 0 0 12px; font-size: .85rem; color: #566274; }

  .leaflet-control-zoom a { color: #0B1C38; }
  .leaflet-control-attribution { font-family: var(--fonte); }

  @media (max-width: 480px) {
    .marca { min-height: 66px; margin-bottom: 16px; padding-block: 9px; }
    .marca img { width: 35px; height: 48px; }
    .marca-nome { font-size: .86rem; }
    .marca-lema { font-size: .63rem; }
    h1 { font-size: 1.45rem; }
  }
</style>
</head>

      <h1 id="titulo">Em qual ala você ficará?</h1>
      <p class="sub" id="subtitulo">Digite seu endereço para ver a ala do novo alinhamento.</p>
    </header>

    <form id="form" role="search" autocomplete="off">
      <label for="q" class="sr-only">Seu endereço</label>
      <div class="campo">
        <input id="q" type="search" placeholder="Rua, número e bairro" enterkeyhint="search">
        <button class="btn" type="submit" id="btnBuscar">Buscar</button>
      </div>
      <div class="apoio">
        <button type="button" class="link" id="btnLocal">Usar minha localização</button>
        <span>ou toque no mapa</span>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite"></div>
    <section id="resultado" aria-live="polite" hidden></section>
    <ul id="outros" hidden></ul>

    <section class="alas" aria-labelledby="h-alas">
      <h2 id="h-alas">Ver o mapa de cada ala</h2>
      <ul id="listaAlas"></ul>

      <div id="detalhe">
        <h3 id="detNome"></h3>
        <p id="detTexto"></p>
        <div class="botoes">
          <button type="button" class="btn sec" id="btnKml">Baixar KML</button>
          <button type="button" class="btn sec" id="btnGeo">Baixar GeoJSON</button>
          <button type="button" class="btn" id="btnCartaz">Cartaz em PDF…</button>
        </div>
      </div>
    </section>

    <p class="rodape" id="rodape"></p>

  </aside>

  <main id="mapa" aria-label="Mapa das alas"></main>
</div>

<dialog id="dlgCartaz" aria-labelledby="dlgTitulo">
  <h2 id="dlgTitulo">Cartaz</h2>
  <p class="dlg-sub">Gera um mapa grande, com nomes de ruas, escala e legenda, pronto para imprimir.</p>

  <div class="linha">
    <label for="optPapel">Tamanho do papel</label>
    <select id="optPapel">
      <option value="A4">A4 (21 × 29,7 cm)</option>
      <option value="A3" selected>A3 (29,7 × 42 cm)</option>
      <option value="A2">A2 (42 × 59,4 cm)</option>
    </select>
  </div>
  <div class="linha">
    <label for="optDetalhe">Nomes de ruas</label>
    <select id="optDetalhe">
      <option value="padrao" selected>Padrão (letras maiores)</option>
      <option value="alto">Mais detalhado (mais ruas, letras menores)</option>
    </select>
  </div>
  <div class="linha">
    <label for="optFundo">Mapa de fundo</label>
    <select id="optFundo">
      <option value="carto" selected>Ruas em alta resolução (CARTO)</option>
      <option value="osm">OpenStreetMap padrão</option>
    </select>
  </div>
  <label class="check" id="lblOutras"><input type="checkbox" id="optOutras" checked> Mostrar o contorno das outras alas</label>

  <progress id="dlgProg" value="0" max="1" hidden></progress>
  <p id="dlgMsg" role="status" aria-live="polite"></p>

  <div class="botoes">
    <button type="button" class="btn" id="btnGerarPdf">Gerar PDF</button>
    <button type="button" class="btn sec" id="btnGerarPng">Gerar PNG</button>
    <button type="button" class="link" id="btnFechar">Fechar</button>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="dados-alas.js"></script>
<script src="capelas.js"></script>
<script src="cartaz.js"></script>
<script>
(function () {
  'use strict';

  /* ===================== CONFIGURAÇÃO ===================== */
  const CONFIG = {
    titulo: 'Em qual ala você ficará?',
    subtitulo: 'Digite seu endereço para ver a ala do novo alinhamento.',
    nomeUnidade: 'Estaca Fortaleza Brasil Messejana', // aparece no rodapé do cartaz
    subtituloCartaz: 'Novo alinhamento das alas',
    aviso: '',                        // ex.: 'Proposta sujeita à aprovação da presidência da estaca.'
    sufixoBusca: 'Fortaleza, Ceará, Brasil', // usado se a 1ª busca não achar nada
    margemMetros: 100,                // avisa se o endereço estiver a menos disso do limite
    contato: 'Em caso de dúvida, fale com o bispado.',
  };
  const PALETA = ['#F5E663', '#FF6F61', '#EE4DA6', '#3FC8F0', '#8A78D0', '#5FC28A', '#F2A65A'];
  /* ======================================================== */

  const $ = (s) => document.querySelector(s);
  const reduzir = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (typeof ALAS_GEOJSON === 'undefined' || !ALAS_GEOJSON.features) {
    $('#titulo').textContent = 'Dados não encontrados';
    $('#subtitulo').textContent = 'Confirme se o arquivo dados-alas.js está na mesma pasta que o index.html.';
    return;
  }

  /* ---------- Dados ---------- */
  const features = ALAS_GEOJSON.features
    .filter((f) => f.geometry && (f.geometry.type === 'Polygon' || f.geometry.type === 'MultiPolygon'))
    .map((f, i) => {
      const p = f.properties || {};
      const cor = /^#[0-9a-f]{6}$/i.test(p.cor || '') ? p.cor : PALETA[i % PALETA.length];
      return { id: 'a' + i, nome: p.nome || p.name || 'Ala ' + (i + 1), cor, geometry: f.geometry, camada: null };
    });

  function poligonos(g) { return g.type === 'Polygon' ? [g.coordinates] : g.coordinates; }

  /* ---------- Geometria ---------- */
  function noAnel(x, y, anel) {
    let dentro = false;
    for (let i = 0, j = anel.length - 1; i < anel.length; j = i++) {
      const xi = anel[i][0], yi = anel[i][1], xj = anel[j][0], yj = anel[j][1];
      if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) dentro = !dentro;
    }
    return dentro;
  }
  function noPoligono(x, y, poly) {
    if (!noAnel(x, y, poly[0])) return false;
    for (let k = 1; k < poly.length; k++) if (noAnel(x, y, poly[k])) return false;
    return true;
  }
  function contem(f, lat, lng) {
    return poligonos(f.geometry).some((p) => noPoligono(lng, lat, p));
  }
  // distância aproximada (m) do ponto até a borda mais próxima
  function distBorda(f, lat, lng) {
    const kx = 111320 * Math.cos((lat * Math.PI) / 180), ky = 110540;
    let min = Infinity;
    poligonos(f.geometry).forEach((p) => p.forEach((anel) => {
      for (let i = 0; i < anel.length - 1; i++) {
        const ax = (anel[i][0] - lng) * kx, ay = (anel[i][1] - lat) * ky;
        const bx = (anel[i + 1][0] - lng) * kx, by = (anel[i + 1][1] - lat) * ky;
        const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
        let t = l2 ? -(ax * dx + ay * dy) / l2 : 0;
        t = Math.max(0, Math.min(1, t));
        const d = Math.hypot(ax + t * dx, ay + t * dy);
        if (d < min) min = d;
      }
    }));
    return min;
  }

  /* ---------- Cores ---------- */
  function luminancia(hex) {
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.substr(i, 2), 16) / 255)
      .map((c) => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)));
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }
  function tintaSobre(hex) { return luminancia(hex) > 0.18 ? '#13222B' : '#FFFFFF'; }
  function escurecer(hex, f) {
    f = f || 0.55;
    return '#' + [1, 3, 5].map((i) => Math.round(parseInt(hex.substr(i, 2), 16) * f).toString(16).padStart(2, '0')).join('');
  }

  /* ---------- Mapa ---------- */
  const mapa = L.map('mapa', { zoomControl: true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(mapa);

  features.forEach((f) => {
    f.camada = L.geoJSON({ type: 'Feature', properties: {}, geometry: f.geometry }, {
      style: { color: escurecer(f.cor), weight: 2.5, fillColor: f.cor, fillOpacity: 0.4 },
      onEachFeature: (_feat, layer) => layer.bindTooltip(f.nome, { permanent: true, direction: 'center', className: 'rotulo-ala' }),
    }).addTo(mapa);
  });

  let selecionada = null; // id da ala isolada, ou null para todas

  function limitesAtuais() {
    let b = null;
    features.filter((f) => !selecionada || f.id === selecionada).forEach((f) => {
      const bb = f.camada.getBounds();
      b = b ? b.extend(bb) : L.latLngBounds(bb.getSouthWest(), bb.getNorthEast());
    });
    return b;
  }
  function ajustar(animar) {
    const b = limitesAtuais();
    if (b) mapa.fitBounds(b, { padding: [30, 30], animate: animar !== false && !reduzir });
  }
  ajustar(false);

  new ResizeObserver(() => mapa.invalidateSize()).observe($('#mapa'));

  /* ---------- Lista de alas / isolar ---------- */
  const listaAlas = $('#listaAlas');
  function criarChip(id, nome, cor) {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.dataset.id = id || '';
    b.setAttribute('aria-pressed', 'false');
    const ponto = document.createElement('span');
    ponto.className = 'ponto'; ponto.style.background = cor || 'conic-gradient(#F5E663,#FF6F61,#EE4DA6,#3FC8F0,#8A78D0,#F5E663)';
    b.appendChild(ponto); b.appendChild(document.createTextNode(nome));
    b.addEventListener('click', () => isolar(id));
    li.appendChild(b); listaAlas.appendChild(li);
  }
  criarChip(null, 'Todas', null);
  features.forEach((f) => criarChip(f.id, f.nome, f.cor));

  function isolar(id) {
    selecionada = id;
    features.forEach((f) => {
      const mostrar = !id || f.id === id;
      if (mostrar && !mapa.hasLayer(f.camada)) f.camada.addTo(mapa);
      if (!mostrar && mapa.hasLayer(f.camada)) mapa.removeLayer(f.camada);
    });
    ajustar();
    atualizarDetalhe();
  }

  function atualizarDetalhe() {
    document.querySelectorAll('.chip').forEach((b) => {
      b.setAttribute('aria-pressed', String((b.dataset.id || null) === selecionada));
    });
    const f = features.find((x) => x.id === selecionada);
    $('#detNome').textContent = f ? f.nome : 'Todas as alas';
    $('#detTexto').textContent = f
      ? 'Gere o cartaz desta ala para imprimir, ou baixe só o limite dela.'
      : 'Escolha uma ala acima para gerar o cartaz só dela.';
  }
  atualizarDetalhe();

  /* ---------- Marcador e resultado ---------- */
  const icone = L.divIcon({ className: 'pino', html: '<span></span>', iconSize: [26, 26], iconAnchor: [13, 31] });
  let marcador = null;

  function definirStatus(msg, erro) {
    const s = $('#status');
    s.textContent = msg || '';
    s.className = erro ? 'erro' : '';
  }

  function nota(texto, info) {
    const p = document.createElement('p');
    p.className = 'nota' + (info ? ' info' : '');
    p.textContent = texto;
    return p;
  }

  function marcar(lat, lng, rotulo, aproximado) {
    if (marcador) mapa.removeLayer(marcador);
    marcador = L.marker([lat, lng], { icon: icone, keyboard: false }).addTo(mapa);

    const achadas = features.filter((f) => contem(f, lat, lng));
    const menorDist = Math.min(...features.map((f) => distBorda(f, lat, lng)));

    // Se a ala do endereço não estiver visível, volta a mostrar todas
    if (selecionada && !achadas.some((f) => f.id === selecionada)) isolar(null);

    const alvo = reduzir ? { animate: false } : { animate: true, duration: 0.8 };
    mapa.setView([lat, lng], Math.max(mapa.getZoom(), 15), alvo);

    const box = $('#resultado');
    box.replaceChildren();
    box.hidden = false;

    const bloco = document.createElement('div');
    const pre = document.createElement('p'); pre.className = 'pre';
    const nome = document.createElement('p'); nome.className = 'nome';
    const end = document.createElement('p'); end.className = 'end';
    end.textContent = rotulo;

    if (achadas.length) {
      const f = achadas[0];
      bloco.className = 'bloco';
      bloco.style.background = f.cor;
      bloco.style.color = tintaSobre(f.cor);
      pre.textContent = 'No novo alinhamento, seu endereço fica na';
      nome.textContent = f.nome;
    } else {
      bloco.className = 'bloco fora';
      pre.textContent = 'Resultado';
      nome.textContent = 'Este ponto está fora dos limites das alas.';
    }
    bloco.append(pre, nome, end);
    box.appendChild(bloco);

    if (achadas.length > 1) box.appendChild(nota('Os limites se sobrepõem neste ponto. ' + CONFIG.contato));
    else if (!achadas.length) box.appendChild(nota(CONFIG.contato));
    else if (menorDist <= CONFIG.margemMetros) {
      box.appendChild(nota('Seu endereço está perto do limite entre alas. Confirme com o bispado.'));
    }
    if (aproximado) {
      box.appendChild(nota('O endereço foi localizado só até a rua. Toque no mapa, no ponto exato da sua casa, para conferir.', true));
    }
    definirStatus('');
  }

  /* ---------- Busca de endereço (OpenStreetMap / Nominatim) ---------- */
  let caixa = null;
  (function () {
    const b = limitesAtuais();
    if (b) {
      const m = 0.12;
      caixa = [b.getWest() - m, b.getNorth() + m, b.getEast() + m, b.getSouth() - m].join(',');
    }
  })();

  async function nominatim(q, restrito) {
    const p = new URLSearchParams({ format: 'jsonv2', q, limit: '5', countrycodes: 'br', 'accept-language': 'pt-BR' });
    if (restrito && caixa) { p.set('viewbox', caixa); p.set('bounded', '1'); }
    const r = await fetch('https://nominatim.openstreetmap.org/search?' + p.toString());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  function rotuloCurto(r) { return r.display_name.split(',').slice(0, 4).join(',').trim(); }
  function ehPreciso(r) { return r.category === 'building' || r.type === 'house' || r.addresstype === 'house'; }

  function aplicar(r) {
    marcar(parseFloat(r.lat), parseFloat(r.lon), rotuloCurto(r), !ehPreciso(r));
  }

  function mostrarOutros(lista) {
    const ul = $('#outros');
    ul.replaceChildren();
    if (lista.length < 2) { ul.hidden = true; return; }
    const cab = document.createElement('li'); cab.className = 'titulo-outros'; cab.textContent = 'Não é este? Outros resultados:';
    ul.appendChild(cab);
    lista.slice(1).forEach((r) => {
      const li = document.createElement('li');
      const b = document.createElement('button'); b.type = 'button'; b.textContent = rotuloCurto(r);
      b.addEventListener('click', () => { aplicar(r); });
      li.appendChild(b); ul.appendChild(li);
    });
    ul.hidden = false;
  }

  $('#form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const texto = $('#q').value.trim();
    if (!texto) { definirStatus('Digite o endereço para buscar.', true); return; }
    const btn = $('#btnBuscar');
    btn.disabled = true; definirStatus('Buscando endereço…');
    $('#outros').hidden = true;
    try {
      let res = await nominatim(texto, true);
      if (!res.length) res = await nominatim(texto + ', ' + CONFIG.sufixoBusca, false);
      if (!res.length) {
        definirStatus('Não encontramos esse endereço. Tente só o nome da rua e o bairro, ou toque no mapa.', true);
      } else {
        aplicar(res[0]);
        mostrarOutros(res);
      }
    } catch (err) {
      definirStatus('Não foi possível buscar agora. Verifique sua conexão e tente de novo, ou toque no mapa.', true);
    } finally {
      btn.disabled = false;
    }
  });

  $('#btnLocal').addEventListener('click', () => {
    if (!navigator.geolocation) { definirStatus('Seu navegador não permite usar a localização.', true); return; }
    definirStatus('Obtendo sua localização…');
    navigator.geolocation.getCurrentPosition(
      (pos) => { $('#outros').hidden = true; marcar(pos.coords.latitude, pos.coords.longitude, 'Sua localização atual', false); },
      () => definirStatus('Não foi possível obter sua localização. Digite o endereço ou toque no mapa.', true),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });

  mapa.on('click', (e) => {
    $('#outros').hidden = true;
    marcar(e.latlng.lat, e.latlng.lng, 'Ponto marcado no mapa', false);
  });

  /* ---------- Exportar ---------- */
  function slug(t) {
    return t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }
  function baixar(nome, tipo, conteudo) {
    const url = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
    const a = document.createElement('a');
    a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }
  function selecao() { return features.filter((f) => !selecionada || f.id === selecionada); }
  function nomeArquivo() { const s = selecao(); return s.length === 1 ? slug(s[0].nome) : 'todas-as-alas'; }

  function esc(t) { return String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c])); }
  function kmlCor(hex, alfa) { return alfa + hex.substr(5, 2) + hex.substr(3, 2) + hex.substr(1, 2); }
  function coordsKml(anel) { return anel.map((c) => c[0] + ',' + c[1] + ',0').join(' '); }
  function poligonoKml(poly) {
    let s = '<Polygon><outerBoundaryIs><LinearRing><coordinates>' + coordsKml(poly[0]) + '</coordinates></LinearRing></outerBoundaryIs>';
    for (let i = 1; i < poly.length; i++) s += '<innerBoundaryIs><LinearRing><coordinates>' + coordsKml(poly[i]) + '</coordinates></LinearRing></innerBoundaryIs>';
    return s + '</Polygon>';
  }
  function gerarKml(lista) {
    const titulo = lista.length === 1 ? lista[0].nome : 'Alas — novos limites';
    let s = '<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>' + esc(titulo) + '</name>';
    lista.forEach((f) => {
      s += '<Style id="' + f.id + '"><LineStyle><color>' + kmlCor(escurecer(f.cor), 'ff') + '</color><width>3</width></LineStyle>' +
           '<PolyStyle><color>' + kmlCor(f.cor, '66') + '</color></PolyStyle></Style>';
    });
    lista.forEach((f) => {
      const polys = poligonos(f.geometry).map(poligonoKml).join('');
      s += '<Placemark><name>' + esc(f.nome) + '</name><styleUrl>#' + f.id + '</styleUrl>' +
           (f.geometry.type === 'Polygon' ? polys : '<MultiGeometry>' + polys + '</MultiGeometry>') + '</Placemark>';
    });
    return s + '</Document></kml>';
  }

  $('#btnKml').addEventListener('click', () => {
    baixar(nomeArquivo() + '.kml', 'application/vnd.google-earth.kml+xml', gerarKml(selecao()));
  });
  $('#btnGeo').addEventListener('click', () => {
    const fc = {
      type: 'FeatureCollection',
      features: selecao().map((f) => ({ type: 'Feature', properties: { nome: f.nome, cor: f.cor }, geometry: f.geometry })),
    };
    baixar(nomeArquivo() + '.geojson', 'application/geo+json', JSON.stringify(fc, null, 1));
  });

  /* ---------- Capelas (opcional: arquivo capelas.js) ---------- */
  const CAPELAS_LISTA = (typeof CAPELAS !== 'undefined' && Array.isArray(CAPELAS))
    ? CAPELAS.filter((c) => typeof c.lat === 'number' && typeof c.lng === 'number') : [];

  CAPELAS_LISTA.forEach((c) => {
    const mk = L.marker([c.lat, c.lng], { icon: L.divIcon({ className: 'capela', html: ICONE_CAPELA, iconSize: [30, 30], iconAnchor: [15, 15] }), keyboard: false });
    if (c.nome) mk.bindTooltip(c.nome, { direction: 'top', offset: [0, -16] });
    mk.addTo(mapa);
  });

  /* ---------- Cartaz (PDF / PNG em alta resolução) ---------- */
  const dlg = $('#dlgCartaz');
  let gerando = false, cancelar = false;

  function msgCartaz(t, erro) { const m = $('#dlgMsg'); m.textContent = t || ''; m.className = erro ? 'erro' : ''; }
  function carregarImagem(url) {
    return new Promise((resolve) => {
      const im = new Image();
      const t = setTimeout(() => resolve(null), 20000);
      im.crossOrigin = 'anonymous';
      im.onload = () => { clearTimeout(t); resolve(im); };
      im.onerror = () => { clearTimeout(t); resolve(null); };
      im.src = url;
    });
  }
  async function prepararFontes() {
    try {
      await Promise.all([
        document.fonts.load('700 40px "Bricolage Grotesque"'), document.fonts.load('400 40px "Figtree"'),
        document.fonts.load('500 40px "Figtree"'), document.fonts.load('600 40px "Figtree"'),
      ]);
    } catch (e) { /* usa fonte reserva */ }
  }
  function travar(sim) {
    ['#btnGerarPdf', '#btnGerarPng', '#optPapel', '#optDetalhe', '#optFundo', '#optOutras'].forEach((s) => { $(s).disabled = sim; });
  }

  $('#btnCartaz').addEventListener('click', () => {
    const f = features.find((x) => x.id === selecionada);
    $('#dlgTitulo').textContent = f ? 'Cartaz: ' + f.nome : 'Cartaz: todas as alas';
    $('#lblOutras').hidden = !f;
    msgCartaz(''); $('#dlgProg').hidden = true; travar(false);
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  });
  $('#btnFechar').addEventListener('click', () => dlg.close());
  dlg.addEventListener('close', () => { if (gerando) cancelar = true; });

  async function gerar(formato) {
    if (gerando) return;
    gerando = true; cancelar = false; travar(true);
    const sel = features.find((x) => x.id === selecionada);
    const papel = $('#optPapel').value;
    const prog = $('#dlgProg');
    try {
      msgCartaz('Preparando…'); prog.hidden = false; prog.value = 0; prog.max = 1;
      await prepararFontes();
      const r = await Cartaz.renderizar({
        features: features.map((f) => ({ id: f.id, nome: f.nome, cor: f.cor, geometry: f.geometry })),
        foco: sel ? [sel.id] : null,
        capelas: CAPELAS_LISTA,
        opcoes: { papel, detalhe: $('#optDetalhe').value, fundo: $('#optFundo').value, outras: $('#optOutras').checked },
        texto: { unidade: CONFIG.nomeUnidade, subtitulo: CONFIG.subtituloCartaz, exemplo: !!ALAS_GEOJSON.exemplo },
        deps: {
          criarCanvas: (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; },
          carregarImagem,
          aoProgresso: (f, t) => { prog.max = t; prog.value = f; msgCartaz('Baixando o mapa… ' + f + ' de ' + t); },
          cancelado: () => cancelar,
        },
      });
      msgCartaz('Montando o arquivo…');
      const nome = 'cartaz-' + slug(sel ? sel.nome : 'todas-as-alas') + '-' + papel.toLowerCase();
      if (formato === 'pdf') {
        const blob = await new Promise((res) => r.canvas.toBlob(res, 'image/jpeg', 0.92));
        if (!blob) throw new Error('canvas-grande');
        const pdf = Cartaz.montarPdf(new Uint8Array(await blob.arrayBuffer()), r.canvas.width, r.canvas.height, r.largura_mm, r.altura_mm);
        baixar(nome + '.pdf', 'application/pdf', pdf);
      } else {
        const blob = await new Promise((res) => r.canvas.toBlob(res, 'image/png'));
        if (!blob) throw new Error('canvas-grande');
        baixar(nome + '.png', 'image/png', blob);
      }
      prog.hidden = true;
      if (r.falhas > 0) {
        msgCartaz('Arquivo baixado, mas ' + r.falhas + ' de ' + r.total + ' pedaços do mapa não carregaram (ficaram cinza). Tente de novo ou troque o mapa de fundo.', true);
      } else {
        msgCartaz('Pronto! O arquivo foi baixado.');
      }
    } catch (e) {
      prog.hidden = true;
      if (e && e.message === 'cancelado') msgCartaz('Cancelado.');
      else if (e && e.message === 'canvas-grande') msgCartaz('Seu aparelho não conseguiu montar uma imagem tão grande. Tente o papel A4 ou use um computador.', true);
      else msgCartaz('Não foi possível gerar o cartaz. Verifique sua conexão e tente de novo.', true);
    } finally {
      gerando = false; travar(false);
    }
  }
  $('#btnGerarPdf').addEventListener('click', () => gerar('pdf'));
  $('#btnGerarPng').addEventListener('click', () => gerar('png'));

  /* ---------- Textos gerais ---------- */
  $('#titulo').textContent = CONFIG.titulo;
  $('#subtitulo').textContent = CONFIG.subtitulo;
  document.title = CONFIG.titulo;
  $('#rodape').textContent =
    'O endereço digitado é enviado ao serviço de busca do OpenStreetMap só para achar o ponto no mapa; este site não guarda nada. ' + CONFIG.contato;

  const aviso = $('#aviso');
  if (ALAS_GEOJSON.exemplo) {
    aviso.textContent = 'DADOS DE EXEMPLO: os limites abaixo são fictícios. Substitua o arquivo dados-alas.js antes de compartilhar.';
    aviso.hidden = false;
  } else if (CONFIG.aviso) {
    aviso.textContent = CONFIG.aviso;
    aviso.hidden = false;
  }
})();
